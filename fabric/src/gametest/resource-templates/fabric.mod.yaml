schemaVersion: 1
id: "${name}-gametest"
version: "${version}"
name: "${name} game tests"

license: "MIT"

entrypoints:
  main:
    - "net.kyori.adventure.platform.test.fabric.gametest.AdventureGameTestMod"
  fabric-client-gametest:
    - "net.kyori.adventure.platform.test.fabric.gametest.client.AdventureClientGameTest"
  fabric-gametest:
    - "net.kyori.adventure.platform.test.fabric.gametest.server.CommandSourceGameTests"
    - "net.kyori.adventure.platform.test.fabric.gametest.server.ConversionGameTests"
    - "net.kyori.adventure.platform.test.fabric.gametest.server.MixinAuditGameTest"
mixins:
  - "adventure-platform-fabric-gametest.mixins.json"

depends:
  fabricloader: ">=0.20.1"
  adventure-platform-fabric: "*"
  fabric-api: "*"
